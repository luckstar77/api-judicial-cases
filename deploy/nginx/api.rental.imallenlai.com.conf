# /etc/nginx/sites-enabled/api.rental.imallenlai.com（參考用，certbot 管理的 SSL 區段維持原樣）
server {
        server_name  api.rental.imallenlai.com;

        # 案例最多 10 張、每張 5MB 的圖片
        client_max_body_size 60m;

        location / {
            proxy_pass http://127.0.0.1:3010;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # 後端 trust proxy = loopback，從這裡取得真實來源 IP
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.rental.imallenlai.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.rental.imallenlai.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = api.rental.imallenlai.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

        server_name  api.rental.imallenlai.com;
    listen 80;
    return 404; # managed by Certbot
}
