# E2E 測試用 MySQL（與正式機相同的 8.0、utf8mb4、STRICT 模式）
services:
  mysql-test:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: rental_test
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    ports:
      - '3307:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-ptest']
      interval: 3s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/mysql
